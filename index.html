
<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover permite que o app use o espaço atrás da câmera/notch -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1A2530" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Espiritualizei">
    <link rel="apple-touch-startup-image" href="/apple-touch-icon.png">
    <title>Espiritualizei</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="shortcut icon" href="/favicon.ico">

    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                dark: '#1A2530',
                violet: '#A78BFA',
              },
            }
          }
        }
      }
    </script>
    <style>
      :root {
        /* Variáveis automáticas que o navegador/sistema preenche */
        --sat: env(safe-area-inset-top);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
        --sar: env(safe-area-inset-right);
      }
      .pt-safe { padding-top: max(1rem, var(--sat)); }
      .pb-safe { padding-bottom: max(1rem, var(--sab)); }
      .pl-safe { padding-left: var(--sal); }
      .pr-safe { padding-right: var(--sar); }
      
      html, body { 
        background-color: #1A2530; 
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        /* Evita o efeito "elástico" de scroll no iOS que quebra o layout fixo */
        position: fixed; 
      }
      #root { height: 100%; width: 100%; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.88.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
  <body>
    <div id="root">
      <!-- Splash Screen Inicial (será substituída pelo React) -->
      <div id="pwa-splash" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #1A2530; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999;">
        <div style="width: 120px; height: 120px; background-color: rgba(167, 139, 250, 0.1); border-radius: 30px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.3);">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="#A78BFA" xmlns="http://www.w3.org/2000/svg">
            <path d="M12.0002 20.5502L10.5502 19.2302C5.40019 14.5702 2.00019 11.4802 2.00019 7.69019C2.00019 4.60019 4.42019 2.18019 7.50019 2.18019C9.24019 2.18019 10.9102 2.99019 12.0002 4.27019C13.0902 2.99019 14.7602 2.18019 16.5002 2.18019C19.5802 2.18019 22.0002 4.60019 22.0002 7.69019C22.0002 11.4802 18.6002 14.5702 13.4502 19.2402L12.0002 20.5502Z" />
          </svg>
        </div>
        <h1 style="color: white; font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -0.05em; margin: 0;">Espiritualizei</h1>
        <div style="margin-top: 40px; width: 40px; height: 2px; background: linear-gradient(to right, transparent, #A78BFA, transparent); animation: pulse 2s infinite;"></div>
      </div>
      <style>
        @keyframes pulse {
          0% { opacity: 0.3; transform: scaleX(0.5); }
          50% { opacity: 1; transform: scaleX(1.5); }
          100% { opacity: 0.3; transform: scaleX(0.5); }
        }
      </style>
    </div>
    <script type="module" src="/index.tsx"></script>
    <script>
      // Remove a splash screen com uma transição mais suave e lenta
      window.addEventListener('load', function() {
        // Aumentamos para 4 segundos para o usuário apreciar o ícone com calma
        setTimeout(function() {
          const splash = document.getElementById('pwa-splash');
          if (splash) {
            splash.style.opacity = '0';
            splash.style.transition = 'opacity 2s cubic-bezier(0.4, 0, 0.2, 1)';
            setTimeout(() => splash.remove(), 2000);
          }
        }, 4000);
      });
    </script>
  </body>
</html>
